name: Gerar APK
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Criar projeto Android
        run: |
          mkdir www && cp index.html www/
          npm init -y
          npm install @capacitor/core@8 @capacitor/android@8
          npm install -D @capacitor/cli@8
          npx cap init "Mac Messenger" com.macmessenger.app --web-dir www
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA" /></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Colocar o ícone
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          for f in android/app/src/main/res/mipmap-*dpi/ic_launcher*.png; do
            convert icone.png -resize "$(identify -format '%wx%h' "$f")!" "$f"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mac-messenger-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
